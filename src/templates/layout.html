<!DOCTYPE html>
<html>
<head>
	<title>{% block title %}Data App{% endblock %}</title>
	<style>
		body {
			font-family: sans-serif;
			margin: 40px;
			text-align: center;
		}
		.table {
			margin: 20px auto;
			border-collapse: collapse;
		}
		.table-striped tr:nth-child(even) {
			background-color: #f2f2f2;
		}
		nav {
			background-color: #333;
			padding: 10px 0;
			margin: -40px -40px 40px -40px;
		}
		nav a {
			color: white;
			text-decoration: none;
			margin: 0 20px;
			font-size: 16px;
			display: inline-flex;
			align-items: center;
			gap: 6px;
		}
		nav a:hover {
			color: #f2f2f2;
			text-decoration: underline;
		}
		nav svg {
			width: 18px;
			height: 18px;
			stroke: white;
			fill: none;
		}
	</style>
</head>
<body>
	<nav>
		<a href="/">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5">
				<path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
			</svg>
			Input Data
		</a>
		<a href="/analyze_user_data">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5">
				<path d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0 0 20.25 18V6A2.25 2.25 0 0 0 18 3.75H6A2.25 2.25 0 0 0 3.75 6v12A2.25 2.25 0 0 0 6 20.25Z"/>
			</svg>
			Dashboard
		</a>
	</nav>
	{% block content %}{% endblock %}
</body>
</html>
